<h1>忆江南·春去也</h1>
<p class="meta"><time>约838年（洛阳，年代从约）</time> · 词 · 标签：<a href="../tags/index.html">春思</a></p>
</header>

<figure class="poem-fig">
<img src="../assets/img/spring.svg" alt="春将归去，柳枝兰草惜别">
<figcaption>弱柳从风疑举袂</figcaption>
</figure>

<div class="poem-body">
<p>春去也，多谢洛城人。</p>
<p>弱柳从风疑举袂，丛兰裛露似沾巾。</p>
<p>独坐亦含嚬。</p>
</div>

<section class="annotation">
<h2>题解</h2>
<p>刘禹锡晚年居洛阳，以词写春归：柳如挥袖，兰如垂泪，惜春之人独坐含颦。这是文人填词早期的名作， 与白居易《忆江南》唱和传为词史佳话。</p>
<h2>注释</h2>
<dl>
<dt>多谢</dt>
<dd>殷勤致意，告别</dd>
<dt>裛</dt>
<dd>沾湿</dd>
<dt>嚬</dt>
<dd>同「颦」，皱眉，含愁</dd>
</dl>
<p class="source">出处：《刘禹锡集》</p>
</section>
