<script src="lib/data.js"></script>
<script>
const ROOT = '.'

function renderPostCard(p) {
  return `<article class="post${p.pinned ? ' pinned' : ''}">
<h2><a href="${ROOT}/posts/show.html?id=${p.id}">${p.title}</a></h2>
<p class="meta">${p.pinned ? '<mark>置顶</mark> · ' : ''}<time>${p.date}</time> · ${p.category}</p>
<p class="excerpt">${p.excerpt}</p>
</article>`
}

const posts = [...DATA.posts].sort((a, b) => (b.pinned - a.pinned) || (b.year - a.year))
document.getElementById('post-list').innerHTML = posts.map(renderPostCard).join('\n\n')
</script>
