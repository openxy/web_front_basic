<header>
<h1>竹枝词二首·其一</h1>
<p class="meta"><time>公元822年（夔州刺史任上）</time> · 诗 · 标签：<a href="tags.html">民歌</a></p>
</header>

<figure class="poem-fig">
<img src="img/willow.svg" alt="江边杨柳，江上歌声">
<figcaption>杨柳青青江水平</figcaption>
</figure>

<div class="poem-body">
<p>杨柳青青江水平，</p>
<p>闻郎江上唱歌声。</p>
<p>东边日出西边雨，</p>
<p>道是无晴却有晴。</p>
</div>

<section class="annotation">
<h2>题解</h2>
<p>夔州是民歌竹枝词的故乡，刘禹锡依调填词，把文人诗与民间歌谣嫁接在一起。「晴」谐「情」，语意双关，写少女听了心上人歌声后将信将疑的心事。</p>
<h2>注释</h2>
<dl>
<dt>竹枝词</dt>
<dd>巴渝一带的民歌体裁</dd>
<dt>道</dt>
<dd>说，猜想</dd>
<dt>晴</dt>
<dd>谐音「情」</dd>
</dl>
<p class="source">出处：《刘禹锡集》</p>
</section>
