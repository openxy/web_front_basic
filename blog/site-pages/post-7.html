<h1>秋风引</h1>
<p class="meta"><time>约810年（朗州贬所，年代从约）</time> · 诗 · 标签：<a href="tags.html">秋思</a></p>
</header>



<div class="poem-body">
<p>何处秋风至？</p>
<p>萧萧送雁群。</p>
<p>朝来入庭树，</p>
<p>孤客最先闻。</p>
</div>

<section class="annotation">
<h2>题解</h2>
<p>贬居朗州所作。秋风不知从何处吹来，而贬谪在外的孤客总是最先听到——以问起笔，以孤客收束，二十字 写尽迁客的敏感与孤独。</p>
<h2>注释</h2>
<dl>
<dt>引</dt>
<dd>古代诗体名，近于歌行</dd>
<dt>萧萧</dt>
<dd>风声</dd>
<dt>孤客</dt>
<dd>孤身漂泊在外的人，诗人自指</dd>
</dl>
<p class="source">出处：《刘禹锡集》</p>
</section>
