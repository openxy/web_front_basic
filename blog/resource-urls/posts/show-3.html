<h1>望洞庭</h1>
<p class="meta"><time>公元824年（赴和州途中）</time> · 诗 · 标签：<a href="../tags/index.html">山水</a></p>
</header>

<figure class="poem-fig">
<img src="../assets/img/mountain.svg" alt="秋夜洞庭湖面，月光下山水如画">
<figcaption>湖光秋月两相和</figcaption>
</figure>

<div class="poem-body">
<p>湖光秋月两相和，</p>
<p>潭面无风镜未磨。</p>
<p>遥望洞庭山水翠，</p>
<p>白银盘里一青螺。</p>
</div>

<section class="annotation">
<h2>题解</h2>
<p>赴和州途中夜泊洞庭。全诗仅四句，却把湖光、秋月、君山写成一幅清雅的水墨小品，比喻轻巧，历来为人称道。</p>
<h2>注释</h2>
<dl>
<dt>和</dt>
<dd>和谐，水色与月光融为一体</dd>
<dt>镜未磨</dt>
<dd>古铜镜未经打磨则无光泽，比喻无风的湖面</dd>
<dt>青螺</dt>
<dd>比喻君山</dd>
</dl>
<p class="source">出处：《刘禹锡集》</p>
</section>
