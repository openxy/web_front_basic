<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诗文 - 诗豪小筑</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
<script src="../lib/data.js"></script>
<script src="../lib/store.js"></script>
<script src="../lib/auth.js"></script>
<script src="../lib/view.js"></script>
<script>
const ROOT = '..'

const id = Number(new URLSearchParams(location.search).get('id'))
const post = fetchResource('post', id)

function commentsOf() {
  return fetchResource('comment').filter(c => c.postId === id)
}

function renderComments() {
  const comments = commentsOf()
  const items = comments.length
    ? comments.map(c => `<li><strong>${c.author}</strong>（${c.date}）：${c.body}</li>`).join('\n')
    : '<li>还没有评论，来写第一条。</li>'
  document.querySelector('.comments ul').innerHTML = items
}

if (!post) {
  document.title = '诗文不存在 - 诗豪小筑'
  renderPage(ROOT, '文章', `<article class="post-full">
<h1>诗文不存在</h1>
<p class="meta">请从<a href="${ROOT}/posts/index.html">诗文列表</a>进入。</p>
</article>`)
} else {
  document.title = post.title + ' - 诗豪小筑'
  renderPage(ROOT, '文章', `<article class="post-full">
${renderPostFull(ROOT, post, commentsOf())}
</article>`)

  // 匿名评论：提交落库并就地重渲评论列表（front.md 的「允许匿名评论」在此兑现）
  document.getElementById('post-full').addEventListener('submit', e => {
    e.preventDefault()
    const form = e.target
    const body = form.body.value.trim()
    if (!body) return
    saveResource('comment', { postId: id, author: form.author.value.trim() || '匿名', body, date: new Date().toLocaleDateString('zh-CN') })
    form.reset()
    renderComments()
  })
}
</script>

</body>
</html>
