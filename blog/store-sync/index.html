<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页 - 诗豪小筑</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
<script src="lib/data.js"></script>
<script src="lib/store.js"></script>
<script src="lib/auth.js"></script>
<script src="lib/view.js"></script>
<script>
const ROOT = '.'
const PAGE_SIZE = 5

const state = { page: 0 }

function renderList() {
  const posts = sortPosts(fetchResource('post'))
  const pages = Math.max(1, Math.ceil(posts.length / PAGE_SIZE))
  if (state.page > pages - 1) state.page = pages - 1
  const slice = posts.slice(state.page * PAGE_SIZE, (state.page + 1) * PAGE_SIZE)

  document.getElementById('post-list').innerHTML = slice.map(p => renderPostCard(ROOT, p)).join('\n\n')
  document.getElementById('pager').innerHTML = renderPager(pages, state.page)
}

renderPage(ROOT, '首页', `<section class="post-list">
<h1>最新诗文</h1>

<div id="post-list"></div>
<nav class="pager" id="pager"></nav>
</section>`)

// 页码按钮动态生成，监听器挂在容器上（事件委托），新增删除按钮都不用重挂
document.getElementById('pager').addEventListener('click', e => {
  const page = e.target.dataset.page
  if (page !== undefined) {
    state.page = Number(page)
    renderList()
  }
})

renderList()
</script>

</body>
</html>
