<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>表格行操作 · 删除一行</title>
        <!-- 外部依赖经 import map 解析（浏览器原生零构建写法，下载后起任意静态服务器即可运行；
             教学运行环境会把 CDN 条目改写为本地镜像，离线运行） -->
        <script type="importmap">
        {
          "imports": {
            "jquery": "https://cdn.jsdelivr.net/npm/jquery@3.7.1/+esm"
          }
        }
        </script>
        <script type="module">
          // 桥：课程代码是传统全局风格（行内 onclick + 普通脚本），把模块导入的 jQuery 挂到 window 供全页使用
          import $ from 'jquery';
          window.$ = $;
        </script>
    </head>
    <body>
        <div class="info" style='color:red'></div>
        <table>
            <thead>
                <tr>
                    <th>栏目一</th>
                    <th>栏目二</th>
                    <th>栏目三</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <a href="#" id="add" onclick="AddRow();">增加一行</a>
        <script type="text/javascript">
            var row_last_num = 0;

            function AddRow(){
                row_last_num += 1;
                $("tbody").append("<tr id='tr" + row_last_num + "'>" +
                                    "<td>栏目一数据1</td>" +
                                    "<td>栏目二数据2</td>" +
                                    "<td>栏目三数据3</td>" +
                                    "<td><a href='#' class='remove' onclick='RemoveRow(this);'>删除</a></td></tr>");
            }

            function RemoveRow(o){
                $(o).parent().parent().remove();
            }
        </script>
    </body>
</html>
