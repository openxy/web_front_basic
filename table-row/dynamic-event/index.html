<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>表格行操作 · 动态事件</title>
    </head>
    <body>
        <div class="info" style='color:red'></div>
        <table>
            <thead>
                <tr>
                    <th>栏目一</th>
                    <th>栏目二</th>
                    <th>栏目三</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <a href="#" id="add">增加一行</a>
        <script>
            // 事件绑定：addEventListener(事件名, 回调)——监听器挂在元素上，点击发生时回调被调用。
            // 原课程把 onclick 写在 HTML 属性里；现代写法结构与行为分离，行为全部收进脚本
            const add = document.getElementById('add');
            const tbody = document.querySelector('tbody');
            const info = document.querySelector('.info');

            add.addEventListener('click', (event) => {
                event.preventDefault(); // a 的默认行为是跳锚点，在事件对象上拦下
                addRow();
            });

            // 事件委托：监听器只挂 tbody 一个，靠事件冒泡接住任何行的点击（含未来新增的行）。
            // 事件对象 event.target = 实际被点的元素；closest 沿祖先链向上找到第一个匹配者
            tbody.addEventListener('click', (event) => {
                const link = event.target.closest('.remove');
                if (link) {
                    event.preventDefault(); // 生成的链接同样带 href="#"，同样拦下
                    link.closest('tr').remove(); // 从链接向上找到所属行：行删自己，不问第几行
                    return;
                }
                const td = event.target.closest('td.edit'); // 数据单元格带 .edit，操作列不带
                if (td) changeCell(td);
            });

            // 元素插入：模板字符串拼一行 HTML，insertAdjacentHTML 接在 tbody 现有内容之后
            function addRow() {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                      <td class="edit">栏目一数据1</td>
                      <td class="edit">栏目二数据2</td>
                      <td class="edit">栏目三数据3</td>
                      <td><a href="#" class="remove">删除</a></td>
                    </tr>`);
            }

            // 元素替换：replaceWith 原地换下 td、换上 input——位置不变，身份变了。
            // 原文字先拷进 input，编辑不是从零重写（原课程的 input 是空的）
            function changeCell(td) {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = td.textContent;
                input.addEventListener('blur', () => updateCell(input)); // blur 不冒泡，委托不了——只能在 input 诞生这一刻绑
                td.replaceWith(input);
                input.focus();
            }

            // 失焦提交：非空换回 td（td 的点击走 tbody 委托，无需重绑），空值拦下不放行
            function updateCell(input) {
                const text = input.value.trim();
                if (text === '') {
                    info.textContent = '字段不得为空！';
                    input.focus(); // 焦点抢回，编辑不结束
                    return;
                }
                const td = document.createElement('td');
                td.className = 'edit';
                td.textContent = text;
                input.replaceWith(td);
                info.textContent = '';
            }
        </script>
    </body>
</html>
