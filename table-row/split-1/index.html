<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>名单管理 · 动态事件</title>
<style>
  body { font-family: sans-serif; margin: 2rem auto; max-width: 32rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
  th { background: #f5f5f5; }
  .info { color: red; min-height: 1.2em; }
  button { cursor: pointer; }
</style>
</head>
<body>
<h1>名单</h1>
<div class="info"></div>
<button id="add">＋ 添加一行</button>
<table id="list">
  <thead><tr><th>姓名</th><th>邮箱</th><th>操作</th></tr></thead>
  <tbody>
    <tr><td>张三</td><td>zhang@edu.example</td><td><button class="del">删除</button></td></tr>
    <tr><td>李四</td><td>li@edu.example</td><td><button class="del">删除</button></td></tr>
    <tr><td>王五</td><td>wang@edu.example</td><td><button class="del">删除</button></td></tr>
  </tbody>
</table>
<script>
var tbody = document.querySelector('#list tbody');
var info = document.querySelector('.info');

// 页面载入：静态行（张三/李四/王五）的数据单元格也逐个动态绑定编辑事件
var cells = document.querySelectorAll('#list tbody td:not(:last-child)');
for (var i = 0; i < cells.length; i++) bindCellEdit(cells[i]);

// 添加一行：沿用参考版本「创建 tr 再追加」的写法；
// 本版本新增：行内数据单元格在创建时逐个动态绑定编辑事件
document.getElementById('add').onclick = function () {
  var tr = document.createElement('tr');
  tr.innerHTML = '<td>新同学</td><td>new@edu.example</td><td><button class="del">删除</button></td>';
  var cells = tr.querySelectorAll('td:not(:last-child)');
  for (var i = 0; i < cells.length; i++) bindCellEdit(cells[i]);
  tbody.appendChild(tr);
};

// 删除：沿用参考版本的事件委托，一个监听器挂 tbody，靠冒泡接管所有删除按钮
tbody.addEventListener('click', function (e) {
  var btn = e.target.closest('.del');
  if (!btn) return; // 点的不是删除按钮，不管
  btn.closest('tr').remove(); // 行删自己：按 DOM 归属定位，不依赖索引
});

// 动态绑定：给单元格挂「点击进入编辑」事件（初始行、新增行与编辑完成后的 td 都要走这里）
function bindCellEdit(td) {
  td.onclick = function () { startEdit(td); };
}

// 进入编辑：td 原地替换为 input，并给输入框动态绑定失焦/回车提交事件
function startEdit(td) {
  var input = document.createElement('input');
  input.type = 'text';
  input.value = td.textContent;
  td.replaceWith(input);
  input.focus();
  input.onblur = function () { commitEdit(input); };   // 动态事件：失焦即提交
  input.onkeydown = function (e) {                     // 动态事件：回车即提交
    if (e.key === 'Enter') commitEdit(input);
  };
}

// 提交编辑：非空校验通过则变回 td 并重新绑定编辑事件，否则留在输入框并提示
function commitEdit(input) {
  var text = input.value.trim();
  if (text === '') {
    info.textContent = '字段不得为空！';
    input.focus();
    return;
  }
  var td = document.createElement('td');
  td.textContent = text;
  input.replaceWith(td);
  bindCellEdit(td); // 新生成的 td 需要重新动态绑定点击编辑
  info.textContent = '';
}
</script>
</body>
</html>
