<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>名单管理 · 行内绑定</title>
<style>
  body { font-family: sans-serif; margin: 2rem auto; max-width: 32rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
  th { background: #f5f5f5; }
  button { cursor: pointer; }
</style>
</head>
<body>
<h1>名单</h1>
<table id="list">
  <thead><tr><th>姓名</th><th>邮箱</th><th>操作</th></tr></thead>
  <tbody>
    <tr><td>张三</td><td>zhang@edu.example</td><td><button onclick="del(0)">删除</button></td></tr>
    <tr><td>李四</td><td>li@edu.example</td><td><button onclick="del(1)">删除</button></td></tr>
    <tr><td>王五</td><td>wang@edu.example</td><td><button onclick="del(2)">删除</button></td></tr>
  </tbody>
</table>
<p id="tip"></p>
<script>
// 行内绑定：onclick 属性本身就是监听器，参数直接写在 HTML 里（字面量，每行各自带编号）
function del(i) {
  var rows = document.querySelectorAll('#list tbody tr');
  rows[i].remove();
  document.getElementById('tip').textContent = '已删除第 ' + (i + 1) + ' 行（按编号）';
}
</script>
</body>
</html>
