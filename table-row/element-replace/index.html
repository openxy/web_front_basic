<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>表格行操作 · 元素替换</title>
    </head>
    <body>
        <div class="info" style='color:red'></div>
        <table>
            <thead>
                <tr>
                    <th>栏目一</th>
                    <th>栏目二</th>
                    <th>栏目三</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <a href="#" id="add">增加一行</a>
        <script>
            const add = document.getElementById('add');
            const tbody = document.querySelector('tbody');

            // 事件绑定：第一版的概念，行为照旧
            add.addEventListener('click', (event) => {
                event.preventDefault();
                addRow();
            });

            // 事件委托：一个监听器管所有行——删除照旧；本版扩展第二个分支：数据单元格（带 .edit）进编辑
            tbody.addEventListener('click', (event) => {
                const link = event.target.closest('.remove');
                if (link) {
                    event.preventDefault();
                    link.closest('tr').remove();
                    return;
                }
                const td = event.target.closest('td.edit'); // 数据单元格带 .edit，操作列不带
                if (td) changeCell(td);
            });

            // 元素插入：数据单元格带上 .edit 标记（可编辑），操作列不带
            function addRow() {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                      <td class="edit">栏目一数据1</td>
                      <td class="edit">栏目二数据2</td>
                      <td class="edit">栏目三数据3</td>
                      <td><a href="#" class="remove">删除</a></td>
                    </tr>`);
            }

            // 元素替换：replaceWith 原地换下 td、换上 input——位置不变，身份变了。
            // 原文字先拷进 input，编辑不是从零重写（原课程的 input 是空的）
            function changeCell(td) {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = td.textContent;
                td.replaceWith(input);
                input.focus();
            }
        </script>
    </body>
</html>
