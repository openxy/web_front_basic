<!DOCTYPE html>
<html>
<head>
  <title>css layout example</title>
  <meta charset='utf-8'>
  <style type="text/css">

    body{
        font:14px/1.7 sans-serif;
        margin:0;
    }
    .hd,.ft{
        width:600px;
        margin:0 auto;
    }
    .hd{
        background:#333;
        color:#fff;
        padding:10px 12px;
    }
    .main{
        float:left;              /* 块元素浮动后不再独占一行，横向排排站 */
        width:68%;
        background:skyblue;
    }
    .side{
        float:right;
        width:28%;
        background:wheat;
    }
    .page{
        width:600px;
        margin:0 auto;
    }
    .page::after{                /* clearfix：把漂走子项的高度记回父元素，机理见 position 案例浮动四部曲 */
        content:"";
        display:table;
        clear:both;
    }
    .ft{
        background:#eee;
        color:#555;
        padding:8px 12px;
        text-align:center;
    }
  </style>
</head>

<body>
<div class="hd"><b>MySite</b> <span>首页 · 课程 · 关于</span> <span>登录</span></div>
<div class="page">
    <div class="main">
        <h2>主栏</h2>
        <p>这是一个经典的页面骨架：页头放标识与导航，主体分主栏与侧栏，页脚收尾。本案例八代版本实现同一个骨架，每一代换一种布局技术。</p>
        <p>看懂布局演化史的钥匙：每一种新方案都是对前一种缺陷的回答。比较相邻两版的差异时，留意每代解决了什么、又留下了什么。</p>
    </div>
    <div class="side">
        <h3>侧栏</h3>
        <p>侧栏内容比主栏短。它能否与主栏等高、栏间留多少空隙，每一代布局技术交出的答案都不一样——这是贯穿八版的观察点。</p>
    </div>
</div>
<div class="ft">页脚 · 布局演化演示</div>
</body>
</html>
