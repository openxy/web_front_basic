<!DOCTYPE html>
<html>
<head>
  <title>css layout example</title>
  <meta charset='utf-8'>
  <style type="text/css">

    body{
        font:14px/1.7 sans-serif;
        margin:0;
    }
    .hd,.ft{
        width:960px;
        margin:0 auto;
    }
    .hd{
        background:#333;
        color:#fff;
        padding:0 12px;
        display:flex;                  /* 页头成为 flex 容器，子项即刻横排 */
        justify-content:space-between; /* 主轴：两端对齐，中间留白 */
        align-items:center;            /* 交叉轴：垂直置中——传统盒子的百年名题一行解决 */
        height:44px;
    }
    .container_12{               /* container：包裹整个栅格系统的容器，960 = 10 + 60×12 + 20×11 + 10 */
        width:960px;
        margin:0 auto;
    }
    .container_12 .grid_8{       /* 「占 8 列」预先算好写死：60×8 + 20×7 = 620px */
        width:620px;
    }
    .container_12 .grid_4{       /* 60×4 + 20×3 = 300px */
        width:300px;
    }
    .grid_8,.grid_4{
        float:left;              /* 底层正是浮动：栅格是设计理念，实现仍交给 float */
        margin-left:10px;        /* gutter：列间距，两侧各 10px */
        margin-right:10px;
    }
    .main{
        background:skyblue;
    }
    .side{
        background:wheat;
    }
    .page::after{                /* clearfix：把漂走子项的高度记回父元素，机理见 position 案例浮动四部曲 */
        content:"";
        display:table;
        clear:both;
    }
    .ft{
        background:#eee;
        color:#555;
        padding:8px 12px;
        text-align:center;
    }
  </style>
</head>

<body>
<div class="hd"><b>MySite</b> <span>首页 · 课程 · 关于</span> <span>登录</span></div>
<div class="page container_12">
    <div class="main grid_8">
        <h2>主栏</h2>
        <p>这是一个经典的页面骨架：页头放标识与导航，主体分主栏与侧栏，页脚收尾。本案例八代版本实现同一个骨架，每一代换一种布局技术。</p>
        <p>看懂布局演化史的钥匙：每一种新方案都是对前一种缺陷的回答。比较相邻两版的差异时，留意每代解决了什么、又留下了什么。</p>
    </div>
    <div class="side grid_4">
        <h3>侧栏</h3>
        <p>侧栏内容比主栏短。它能否与主栏等高、栏间留多少空隙，每一代布局技术交出的答案都不一样——这是贯穿八版的观察点。</p>
    </div>
</div>
<div class="ft">页脚 · 布局演化演示</div>
</body>
</html>
